<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PocketFleet Web Bridge</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>PocketFleet Web Bridge <small style="font-size:12px;opacity:0.75;font-weight:normal;">v0.8.0</small></h1>
      <label>本机端点 (Local Endpoint)<input id="endpoint" type="url" /></label>
      <label>
        <span>PocketFleet 本地通信鉴权令牌 (Token)</span>
        <div class="token-input-wrapper">
          <input id="token" type="password" autocomplete="off" placeholder="PocketFleet 统一通信令牌；在客户端【复制令牌】后粘贴至此处" />
          <button id="toggleTokenVisibility" type="button" class="btn-eye" title="显示/隐藏令牌" aria-label="显示/隐藏令牌">
            <svg class="eye-icon" viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
              <path class="eye-open" d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle class="eye-open" cx="12" cy="12" r="3"></circle>
              <line class="eye-closed" x1="1" y1="1" x2="23" y2="23" style="display:none;"></line>
            </svg>
          </button>
        </div>
      </label>

      <section class="protocol-start" aria-labelledby="protocol-start-title">
        <div>
          <strong id="protocol-start-title">PocketFleet 多AI协同交互规范</strong>
          <small>出站以 [Telegram]re:{someone} 或 [Telegram][mailto:{someone}] 为开头指明单一收件人。</small>
        </div>
        <button id="startCollaborationProtocol" type="button">加载发信规范说明</button>
      </section>

      <div class="actions">
        <button id="save">保存设置</button>
        <button id="test">测试连接</button>
      </div>

      <div class="execution-control">
        <div><strong>执行总开关</strong><small>控制本地桥接调用与出站放行</small></div>
        <button id="executionControl" type="button" disabled>检测状态中...</button>
      </div>

      <output id="status">尚未测试</output>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
